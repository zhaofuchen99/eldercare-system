server:
  port: 8080

spring:
  application:
    name: eldercare-system

  # ===== 数据源 MySQL 9.7.2 =====
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/eldercare?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:09010402}
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4
      connection-timeout: 30000

  # ===== Redis（redis-stack 容器，含 RediSearch 模块，端口 6380）=====
  data:
    redis:
      host: localhost
      port: 6380
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms

  # ===== AI（DeepSeek 对话 + Ollama bge-m3 Embedding，文档 5.4 / AI 模块）=====
  ai:
    # 关闭 Spring AI 的向量库自动配置（RedisVectorStoreAutoConfiguration 需要
    # Spring Data 的 JedisConnectionFactory，与应用默认的 Lettuce 主连接不符）。
    # 向量库只用自定义 knowledgeVectorStore（AiVectorStoreConfig，手动 Jedis RedisClient）。
    vectorstore:
      type: none
    openai:
      # 生产必须用环境变量 DEEPSEEK_API_KEY 注入真实 Key；
      # 这里给非空占位默认值，保证未配 Key 时应用也能启动（AI 调用会由业务层降级为失败标记）
      api-key: ${DEEPSEEK_API_KEY:sk-eldercare-dev-placeholder}
      base-url: https://api.deepseek.com
      chat:
        options:
          # DeepSeek 对话模型（此前缺失，用 starter 默认模型；显式指定避免歧义）
          model: deepseek-chat
      # Embedding 指向本地 Ollama 的 OpenAI 兼容端点（bge-m3，1024 维）：
      # 注意1：Spring AI 2.0 中 model/dimensions 平铺在 spring.ai.openai.embedding.* 下（不在 options 内）。
      # 注意2：base-url 必须带 /v1 —— OpenAI 客户端拼的是 base-url + "/embeddings"，
      #       Ollama 只认 /v1/embeddings，不带 /v1 会 404。
      # 注意3：RedisVectorStore 初始化会调用 embedding 探测维度，Ollama 未启动时应用启动会失败。
      embedding:
        base-url: http://localhost:11434/v1
        api-key: ollama                    # Ollama 忽略该值，但 Spring AI 要求非空
        model: bge-m3
        dimensions: 1024                   # bge-m3 向量维度，供 Redis 向量索引 DIM 推断

# ===== MyBatis =====
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.zfc.eldercare.core.entity
  configuration:
    map-underscore-to-camel-case: true
    # 开发期打印 SQL 日志，生产环境建议移除
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ===== PageHelper 分页 =====
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# ===== JWT =====
jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 注入，切勿使用默认值
  secret: ${JWT_SECRET:eldercare-dev-jwt-secret-please-change-in-production-2026}
  access-token-expire: 7200      # Access Token 有效期（秒）：2 小时
  refresh-token-expire: 604800   # Refresh Token 有效期（秒）：7 天

# ===== 文件存储（体检报告等，文档 5.5）=====
eldercare:
  upload-dir: ${UPLOAD_DIR:data/upload}
  # 报告下载链接签名密钥（5 分钟有效，防止盗链）；生产用环境变量注入
  report-download-secret: ${REPORT_DOWNLOAD_SECRET:eldercare-report-download-secret-2026}
