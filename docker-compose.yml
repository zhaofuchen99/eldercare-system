# =====================================================================
# AI 智能养老社区管理系统 · Docker Compose 编排
# ---------------------------------------------------------------------
# 前置：本仓库为单仓结构，前端位于 web-member/ 与 web-admin/ 子目录。
# 使用：cp .env.example .env → 编辑 .env → docker compose up -d --build
# 访问：会员端 http://服务器IP:80   管理端 http://服务器IP:8081
# =====================================================================
name: eldercare

services:
  # ---------- MySQL（首次启动自动执行 sql/init.sql 建库建表） ----------
  mysql:
    image: ${MYSQL_IMAGE:-mysql:9.7}
    container_name: eldercare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: eldercare
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    # 生产环境不对外暴露数据库端口（设计文档 8.5）

  # ---------- Redis（缓存 / Token 黑名单 / 限流） ----------
  redis:
    image: redis:7-alpine
    container_name: eldercare-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    # 生产环境不对外暴露（设计文档 8.5）

  # ---------- 后端（Spring Boot） ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eldercare-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 数据源与 Redis 走容器内网（服务名），覆盖 yaml 里 localhost 默认值
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/eldercare?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # AI：未填 key 时用占位默认值保证启动，AI 调用降级（见 .env.example 说明）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-sk-eldercare-dev-placeholder}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}
      REPORT_DOWNLOAD_SECRET: ${REPORT_DOWNLOAD_SECRET:-eldercare-report-download-secret-2026}
      # 上传文件（体检报告等）持久化到卷
      UPLOAD_DIR: /app/data/upload
      TZ: Asia/Shanghai
    volumes:
      - app-data:/app/data
    healthcheck:
      # /dev/tcp 是 bash 特性，必须显式用 bash 执行
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  # ---------- 会员端（Nginx 托管 + 代理 /api） ----------
  member:
    build:
      context: ./web-member
      dockerfile: Dockerfile
    container_name: eldercare-member
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${MEMBER_PORT:-80}:80"

  # ---------- 管理端（Nginx 托管 + 代理 /api） ----------
  admin:
    build:
      context: ./web-admin
      dockerfile: Dockerfile
    container_name: eldercare-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_PORT:-8081}:80"

volumes:
  mysql-data:
  redis-data:
  app-data:
